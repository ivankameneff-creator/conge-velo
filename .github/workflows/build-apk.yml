name: Build Android APK (Congés & Vélo)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Injecter la configuration Supabase (Secrets / Variables GitHub)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          APP_PWD: ${{ secrets.APP_PASSWORD || vars.APP_PASSWORD }}
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const pwd = process.env.APP_PWD || '';
            const authHash = pwd ? crypto.createHash('sha256').update(pwd).digest('hex') : '';
            const cfg = {
              url: process.env.SUPABASE_URL || '',
              anonKey: process.env.SUPABASE_KEY || '',
              authHash: authHash
            };
            fs.writeFileSync('supabase-config.js', 'window.ZENLEAVE_SUPABASE_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n');
            console.log('supabase-config.js généré avec succès.');
          "

      - name: Préparer et synchroniser les assets mobiles
        run: |
          node scripts/prepare-mobile.js
          ls -la android/app/src/main/assets/public

      - name: Configurer le SDK Android et accepter les licences
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ls -la $ANDROID_HOME/platforms

      - name: Compiler l'APK Android (Debug)
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          if ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log; then
            echo "Gradle build réussi !"
          else
            status=$?
            echo "::error title=BuildFailed::Gradle build a echoue avec le code $status"
            grep -A 8 "What went wrong:" ../gradle-build.log | head -n 8 | while IFS= read -r line; do
              echo "::error title=GradleFailure::$line"
            done
            grep -E "Caused by:|compileSdk|SDK location|License not accepted" ../gradle-build.log | head -n 4 | while IFS= read -r line; do
              echo "::error title=GradleRootCause::$line"
            done
            exit $status
          fi

      - name: Préparer le fichier APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs -name "*.apk" -exec cp {} build-output/Conges-et-Velo-v1.0.apk \;
          ls -la build-output/

      - name: Mettre à disposition l'APK en téléchargement (Artifact GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Conges-et-Velo-Android-APK
          path: build-output/Conges-et-Velo-v1.0.apk
          retention-days: 30

      - name: Publier la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: "Congés & Vélo v1.0 (Android APK)"
          body: |
            ### 📱 Application Android Congés & Vélo (v1.0)
            
            Téléchargez le fichier `Conges-et-Velo-v1.0.apk` ci-dessous directement sur votre smartphone Android pour l'installer.
            
            - **Package :** `fr.zenleave.congevelo`
            - **Application :** Congés & Vélo
            - **Synchronisation :** Supabase Cloud intégrée
          files: build-output/Conges-et-Velo-v1.0.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
