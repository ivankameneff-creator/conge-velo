name: Build Android APK (Congés & Vélo)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Injecter la configuration Supabase (Secrets / Variables GitHub)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          APP_PWD: ${{ secrets.APP_PASSWORD || vars.APP_PASSWORD }}
        run: |
          AUTH_HASH=""
          if [ -n "$APP_PWD" ]; then
            AUTH_HASH=$(echo -n "$APP_PWD" | sha256sum | awk '{print $1}')
          fi

          echo "Génération de supabase-config.js..."
          cat <<EOF > supabase-config.js
          // Fichier généré automatiquement pour l'APK Android
          window.ZENLEAVE_SUPABASE_CONFIG = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_KEY}",
            authHash: "${AUTH_HASH}"
          };
          EOF

      - name: Synchroniser Capacitor avec l'application web
        run: npm run cap:sync

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Compiler l'APK Android (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer et préparer l'APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Conges-et-Velo-v1.0.apk

      - name: Mettre à disposition l'APK en téléchargement (Artifact GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Conges-et-Velo-Android-APK
          path: build-output/Conges-et-Velo-v1.0.apk
          retention-days: 30
