name: Build Android APK (Congés & Vélo)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Donner les permissions d'exécution à gradlew
        run: chmod +x android/gradlew

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Injecter la configuration Supabase (Secrets / Variables GitHub)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          APP_PWD: ${{ secrets.APP_PASSWORD || vars.APP_PASSWORD }}
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const pwd = process.env.APP_PWD || '';
            const authHash = pwd ? crypto.createHash('sha256').update(pwd).digest('hex') : '';
            const cfg = {
              url: process.env.SUPABASE_URL || '',
              anonKey: process.env.SUPABASE_KEY || '',
              authHash: authHash
            };
            fs.writeFileSync('supabase-config.js', 'window.ZENLEAVE_SUPABASE_CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n');
            console.log('supabase-config.js généré avec succès.');
          "

      - name: Préparer les assets et copier dans Android
        run: |
          npm run build
          npx cap copy android
          npx cap update android || true

      - name: Compiler l'APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renommer et préparer l'APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Conges-et-Velo-v1.0.apk

      - name: Mettre à disposition l'APK en téléchargement (Artifact GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Conges-et-Velo-Android-APK
          path: build-output/Conges-et-Velo-v1.0.apk
          retention-days: 30
